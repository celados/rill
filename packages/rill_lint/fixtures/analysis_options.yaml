analyzer:
  exclude:
    - build/**
plugins:
  rill_lint:
    path: ..
    diagnostics:
      rill_cast_to_signal: error
      rill_write_in_computed: error
      rill_write_in_build: error
      rill_create_in_build: error
      rill_untracked_read: error
      rill_write_after_await: error
      rill_effect_in_lifecycle: error
      rill_async_star_stream: error
