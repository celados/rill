name: CI

# The gate CI runs is tool/check.sh --no-bench, split across jobs:
# `check` runs the static checks and every package's tests
# (tool/check.sh --no-mutate), and `mutate` runs every mutant in shards
# (tool/mutate.dart --shard). The shards together run each mutant once.
#
# Pushes, schedules and dispatches run on the celados-linux self-hosted pool;
# fork PRs run untrusted code and stay on GitHub-hosted runners. Each shard
# runs two mutants at a time, one workspace per job.
#
# Follows upstream: every run installs the latest Flutter stable instead of a
# pinned version, so the weekly run catches SDK and analyzer drift.
# Benchmarks stay local (tool/check.sh without flags): shared runners are
# too noisy for the perf gate (docs/bench.md).
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'celados-linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # Per job: the default tool-cache path is shared by every pod on the
          # self-hosted pool, and concurrent jobs would extract into it at once.
          cache-path: "${{ runner.temp }}/flutter/:channel:-:version:-:arch:"
      - run: flutter --version
      - run: tool/check.sh --no-mutate

  mutate:
    name: mutate (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || 'celados-linux' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          # Per job: the default tool-cache path is shared by every pod on the
          # self-hosted pool, and concurrent jobs would extract into it at once.
          cache-path: "${{ runner.temp }}/flutter/:channel:-:version:-:arch:"
      - run: flutter pub get --enforce-lockfile
      - run: dart run tool/mutate.dart --shard ${{ matrix.shard }}/4 --jobs 2
        env:
          # A pod sees all of the shared host's cores; run as many suites at
          # once as a 4 vCPU GitHub-hosted runner did.
          RILL_TEST_CONCURRENCY: "4"
